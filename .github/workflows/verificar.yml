name: Verificar contenido

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar catálogo (estructura, docs, fases, rutas y tests)
        run: node tools/verificar.js
      - name: Comprobar que content/indice.js está actualizado
        run: node tools/generar-indice.js --check
