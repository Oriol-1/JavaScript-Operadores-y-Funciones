<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de pruebas — TechTrack</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<main class="wrap" style="padding-top:var(--sp-6)">
  <h1>Catálogo de pruebas</h1>
  <p class="soft" style="max-width:70ch">
    Filtra por área, nivel o por lo que se te pide hacer. Las pruebas con tests automáticos se corrigen solas;
    las de empresa se evalúan con la rúbrica que usaría el equipo que te entrevista.
  </p>

  <div class="card" style="margin-top:var(--sp-5)">
    <div class="stack">
      <div>
        <label class="field-label" for="q">Buscar</label>
        <input class="input" id="q" type="search" placeholder="debounce, RAG, transacción, accesibilidad…" autocomplete="off">
      </div>
      <div>
        <span class="field-label">Área</span>
        <div class="row row-wrap" id="f-categorias" style="gap:6px"></div>
      </div>
      <div>
        <span class="field-label">Nivel</span>
        <div class="row row-wrap" id="f-niveles" style="gap:6px"></div>
      </div>
      <div>
        <span class="field-label">Qué se te pide hacer</span>
        <div class="row row-wrap" id="f-kinds" style="gap:6px"></div>
      </div>
    </div>
  </div>

  <div class="row" style="margin:var(--sp-5) 0 var(--sp-3)">
    <span class="small muted" id="contador"></span>
    <span class="spacer"></span>
    <button class="btn btn-sm btn-ghost" id="limpiar">Limpiar filtros</button>
  </div>

  <div class="grid grid-3" id="resultados"></div>

  <div id="pie"></div>
</main>

<script src="assets/js/core/registry.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/sandbox.js"></script>
<script src="assets/js/core/ui.js"></script>
<script src="assets/js/pages/catalogo.js"></script>
</body>
</html>
